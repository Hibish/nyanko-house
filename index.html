<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="にゃんこハウス">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe2ec">
<title>にゃんこハウス｜NYANKO HOUSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#fff4e6;
  --bg-2:#ffe2ec;
  --bg-3:#fce1d3;
  --cream:#fff8ee;
  --pink:#ff8fab;
  --pink-deep:#e36b8c;
  --brown:#5b3a29;
  --brown-soft:#8a6a55;
  --gold:#f4b740;
  --mint:#a3d9c9;
  --ink:#3a2418;
  --line:rgba(91,58,41,.18);
  --shadow:0 8px 0 rgba(91,58,41,.12), 0 18px 28px -10px rgba(91,58,41,.22);
  --inset:inset 0 -4px 0 rgba(91,58,41,.12);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overflow-x:hidden}
html{overscroll-behavior:none}
body{
  height:var(--app-h, 100dvh);
  overflow:hidden;
}
body{
  font-family:'M PLUS Rounded 1c','Kosugi Maru',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 600px at 10% 0%,#ffd9e6 0%,transparent 55%),
    radial-gradient(800px 700px at 100% 100%,#ffe9c9 0%,transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2));
  min-height:100vh;
  overflow-x:hidden;
  user-select:none;
}
/* paw print background */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 10% 20%,rgba(255,143,171,.18) 0 6px,transparent 7px),
    radial-gradient(circle at 80% 35%,rgba(244,183,64,.18) 0 5px,transparent 6px),
    radial-gradient(circle at 30% 75%,rgba(163,217,201,.20) 0 6px,transparent 7px),
    radial-gradient(circle at 65% 88%,rgba(255,143,171,.16) 0 4px,transparent 5px);
  background-size:240px 240px;
  opacity:.7;
}

.app{
  position:relative;z-index:1;
  max-width:520px;margin:0 auto;padding:8px 12px;
  min-height:calc(var(--app-h, 100dvh) - 104px - env(safe-area-inset-bottom));
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  height:var(--app-h, 100dvh);
  overflow:hidden;
}
.app.tab-zukan .home-screen, .app.tab-shop .home-screen{display:none}
.app:not(.tab-zukan) .zukan-screen{display:none}
.app:not(.tab-shop) .shop-screen{display:none}
.zukan-screen, .shop-screen{
  height:calc(var(--app-h, 100dvh) - 104px - env(safe-area-inset-bottom) - 40px);
  overflow-y:auto;
}

/* ===== Shop ===== */
.shop-item{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:2px solid var(--ink);
  border-radius:16px;padding:10px;
  margin-bottom:8px;
  box-shadow:0 4px 0 rgba(91,58,41,.12);
}
.shop-item .si-ic{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(180deg,#fff3df,#ffe2c5);
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex:0 0 auto;
}
.shop-item .si-info{flex:1;min-width:0}
.shop-item .si-name{font-weight:800;font-size:13px;color:var(--brown);line-height:1.2}
.shop-item .si-desc{font-size:11px;color:var(--brown-soft);margin-top:2px}
.shop-item .si-buy{
  flex:0 0 auto;
  background:var(--pink);color:#fff;
  border:2px solid var(--ink);border-radius:12px;
  padding:7px 10px;font-family:inherit;font-weight:800;font-size:12px;
  cursor:pointer;
  box-shadow:0 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;
}
.shop-item .si-buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.shop-item .si-buy:disabled{background:#d9c9b6;color:#867560;cursor:not-allowed}
.shop-item .si-buy .price{font-size:10px;opacity:.9}
.shop-item.owned .si-buy{background:#a3d9c9;color:var(--brown)}
.shop-item .stock{
  font-size:10px;color:var(--pink-deep);font-weight:800;margin-top:2px;
}

/* speed-up badge over course */
.speed-badge{
  position:absolute;top:6px;right:6px;
  background:var(--gold);color:#5a3b00;
  font-weight:800;font-size:10px;
  padding:3px 8px;border-radius:999px;
  border:2px solid var(--ink);
  z-index:2;
  animation:speedPulse 1s ease-in-out infinite;
}
@keyframes speedPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* lucky charm indicator on summon button */
.btn.primary.has-charm{
  background:linear-gradient(90deg,var(--pink),#ffd76b);
  position:relative;
}
.btn.primary.has-charm::before{
  content:"🍀";position:absolute;top:-8px;left:-8px;
  font-size:18px;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));
  animation:charmBob 1.4s ease-in-out infinite;
}
@keyframes charmBob{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-3px) rotate(10deg)}}

/* first-time hint */
.first-hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--brown-soft);font-size:12px;letter-spacing:.05em;
  pointer-events:none;
  text-align:center;padding:0 10px;
}

/* ===== Top ad banner ===== */
.ad{
  display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#fff,#fff 8px,#fff3df 8px,#fff3df 16px);
  border:1.5px dashed var(--brown-soft);
  color:var(--brown-soft);
  font-size:11px;letter-spacing:.12em;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
}
.ad.top{display:none}
.ad.bottom{
  position:fixed;left:50%;bottom:0;
  transform:translateX(-50%);
  width:100%;max-width:520px;
  border-radius:14px 14px 0 0;
  z-index:5;
  height:56px;
  background:#fff;
  border:1.5px dashed var(--brown-soft);
  margin:0;
  padding-bottom:env(safe-area-inset-bottom);
  box-sizing:content-box;
}

/* ===== Footer tabs ===== */
.tabs{
  position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:100%;max-width:520px;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:#fffaf2;
  border-top:2px solid var(--ink);
  border-left:2px solid var(--ink);
  border-right:2px solid var(--ink);
  border-radius:18px 18px 0 0;
  z-index:6;
  height:48px;
  margin:0;
  box-shadow:0 -4px 12px rgba(91,58,41,.08);
}
.tab-btn{
  background:transparent;border:none;
  font-family:inherit;font-weight:800;font-size:12px;
  color:var(--brown-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;
  position:relative;
  padding:0;
}
.tab-btn .ic{font-size:18px;line-height:1}
.tab-btn.active{color:var(--pink-deep)}
.tab-btn.active::before{
  content:"";position:absolute;top:0;left:20%;right:20%;height:3px;
  background:var(--pink);border-radius:0 0 3px 3px;
}

/* ===== Header ===== */
.head{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  padding:4px 4px 8px;
  margin-bottom:6px;
}
.currency{
  display:flex;align-items:center;gap:6px;
  background:var(--ink);color:#fff;
  padding:6px 12px;border-radius:999px;
  font-weight:800;font-size:13px;
  box-shadow:var(--inset);
  border:2px solid var(--ink);
}
.currency.cans{
  background:#fff;color:var(--brown);
}
.currency .coin{
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe27a,#f4b740 60%,#c98a1d);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;color:#7a4e0a;font-weight:800;
}
.currency .ic{font-size:15px;line-height:1}
.points{
  display:flex;align-items:center;gap:6px;
  background:var(--ink);color:#fff;
  padding:6px 12px;border-radius:999px;
  font-weight:800;font-size:13px;
  box-shadow:var(--inset);
  border:2px solid var(--ink);
}
.points .coin{
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe27a,#f4b740 60%,#c98a1d);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;color:#7a4e0a;font-weight:800;
}

/* ===== Course ===== */
.course-wrap{
  position:relative;
  background:linear-gradient(180deg,#fff8ee,#ffe9d4);
  border:2px solid var(--ink);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:8px 10px 10px;
  margin-bottom:8px;
  overflow:hidden;
}
.course-title{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:11px;color:var(--brown);
  display:flex;align-items:center;gap:6px;
  margin-bottom:6px;
}
.course-title .tag{
  background:var(--pink);color:#fff;font-weight:800;font-size:9px;
  padding:2px 7px;border-radius:999px;letter-spacing:.1em;
}
.course{
  position:relative;
  width:100%;height:110px;
  background:
    radial-gradient(120px 30px at 50% 100%,rgba(0,0,0,.12),transparent 70%),
    repeating-linear-gradient(90deg,#a3d9c9 0 22px,#92ceba 22px 44px);
  border-radius:14px;
  border:2px solid var(--ink);
  overflow:hidden;
  transition:box-shadow .15s, border-color .15s;
}
.course.drop-target{
  border-color:var(--pink);
  box-shadow:inset 0 0 0 4px rgba(255,143,171,.35);
}
.course::before{
  /* track ring */
  content:"";position:absolute;inset:12px;
  border:3px dashed #fff;
  border-radius:80px;
  opacity:.75;
}
.runner{
  position:absolute;font-size:26px;line-height:1;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));
  transform:translate(-50%,-50%);
  animation:run var(--dur,10s) linear infinite;
  offset-rotate:0deg;
  cursor:grab;
}
.runner.dragging{cursor:grabbing;opacity:.5}
@keyframes run{
  0%   {left:10%; top:50%;}
  25%  {left:50%; top:12%;}
  50%  {left:90%; top:50%;}
  75%  {left:50%; top:88%;}
  100% {left:10%; top:50%;}
}
.bounce{animation-name:run,bob;animation-duration:var(--dur,10s),.5s;animation-iteration-count:infinite,infinite;animation-timing-function:linear,ease-in-out;}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-4px)}}

.coin-pop{
  position:absolute;font-weight:800;font-size:13px;color:var(--gold);
  text-shadow:0 2px 0 #7a4e0a;
  pointer-events:none;animation:pop 1s ease-out forwards;
}
@keyframes pop{
  0%{transform:translateY(0);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-30px);opacity:0}
}
.empty-course{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--brown-soft);font-size:12px;letter-spacing:.05em;
}

/* ===== Grid ===== */
.panel{
  background:linear-gradient(180deg,#fffaf2,#ffeed8);
  border:2px solid var(--ink);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:10px;
  margin-bottom:8px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.panel-head h2{
  font-family:'Mochiy Pop One',sans-serif;
  font-size:12px;color:var(--brown);
}
.hint{font-size:10px;color:var(--brown-soft)}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  max-width:300px;margin:0 auto;
}
.grid.expanded{
  grid-template-columns:repeat(5,1fr);
  max-width:320px;
}
.grid.expanded .cell{
  max-width:58px;max-height:58px;border-radius:12px;
}
.grid.expanded .nyan{font-size:22px}
.cell{
  aspect-ratio:1/1;
  max-width:70px;max-height:70px;
  background:#fff6e5;
  border:2px dashed rgba(91,58,41,.25);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  transition:transform .15s, background .15s, border-color .15s;
}
.cell.drop{background:#fff;border-color:var(--pink);border-style:solid;}
.cell.has .nyan{cursor:grab}
.nyan{
  width:84%;height:84%;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#ffe5d0 60%,#f3c8a5);
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  box-shadow:var(--inset),0 4px 0 rgba(91,58,41,.15);
  position:relative;
  transition:transform .15s;
}
.nyan.dragging{transform:scale(1.08) rotate(-3deg);opacity:.9;z-index:10}
.nyan .lv{
  position:absolute;bottom:-6px;right:-6px;
  background:var(--ink);color:#fff;font-size:9px;font-weight:800;
  border-radius:999px;padding:2px 6px;
  border:2px solid #fff;
}
.nyan.legendary{
  background:radial-gradient(circle at 35% 30%,#fff,#ffe27a 50%,#f4b740 80%);
  animation:glow 1.6s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:var(--inset),0 0 0 0 rgba(244,183,64,.6)}50%{box-shadow:var(--inset),0 0 0 8px rgba(244,183,64,0)}}

/* ===== Gacha animation ===== */
.gacha-overlay{
  position:fixed;inset:0;
  display:none;align-items:center;justify-content:center;
  z-index:40;
  pointer-events:none;
}
.gacha-overlay.show{display:flex}
.gacha-overlay::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at center,rgba(255,231,122,.45),rgba(255,143,171,.25) 40%,transparent 70%);
  animation:gachaFlash 1.2s ease-out forwards;
}
@keyframes gachaFlash{
  0%{opacity:0}
  20%{opacity:1}
  100%{opacity:0}
}
.can-anim{
  position:relative;
  font-size:96px;line-height:1;
  filter:drop-shadow(0 8px 0 rgba(91,58,41,.25));
  animation:canShake .55s ease-in-out, canBurst .65s .55s ease-out forwards;
}
@keyframes canShake{
  0%,100%{transform:translateY(0) rotate(0)}
  15%{transform:translateY(-6px) rotate(-8deg)}
  30%{transform:translateY(0) rotate(8deg)}
  45%{transform:translateY(-8px) rotate(-10deg)}
  60%{transform:translateY(0) rotate(10deg)}
  75%{transform:translateY(-4px) rotate(-6deg)}
}
@keyframes canBurst{
  0%{transform:scale(1);opacity:1}
  40%{transform:scale(1.4);opacity:1;filter:drop-shadow(0 0 30px #fff)}
  100%{transform:scale(0);opacity:0}
}
.can-cat{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:64px;line-height:1;
  animation:catPop .5s .9s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 6px 0 rgba(91,58,41,.25));
}
@keyframes catPop{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}
  60%{transform:translate(-50%,-50%) scale(1.2) rotate(8deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
}
.gacha-ring{
  position:absolute;left:50%;top:50%;
  width:20px;height:20px;border-radius:50%;
  border:4px solid var(--gold);
  transform:translate(-50%,-50%);
  animation:ring 1s .5s ease-out forwards;
  opacity:0;
}
@keyframes ring{
  0%{opacity:1;width:20px;height:20px;border-width:4px}
  100%{opacity:0;width:280px;height:280px;border-width:1px}
}
.gacha-rare{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:0;height:0;
  pointer-events:none;
}
.gacha-rare::before, .gacha-rare::after{
  content:"";position:absolute;
  left:50%;top:50%;
  width:600px;height:6px;
  background:linear-gradient(90deg,transparent,#fff7c2,#ffd24a,#fff7c2,transparent);
  transform:translate(-50%,-50%) rotate(20deg);
  animation:shine .8s .3s ease-out forwards;
  opacity:0;
}
.gacha-rare::after{transform:translate(-50%,-50%) rotate(-15deg);animation-delay:.45s}
@keyframes shine{
  0%{opacity:0;width:0}
  30%{opacity:1}
  100%{opacity:0;width:800px}
}

/* ===== Controls ===== */
.controls{
  display:grid;grid-template-columns:1.4fr 1fr;gap:10px;
}
.btn{
  border:2px solid var(--ink);
  border-radius:16px;
  padding:11px 10px;
  font-family:inherit;font-weight:800;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 4px 0 var(--ink);
  transition:transform .08s, box-shadow .08s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  line-height:1.1;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.reward:disabled{
  background:linear-gradient(90deg,#e8d9b9,#c8b787);
  color:#6a5530;
  opacity:1;
}
.btn.reward:disabled::after{display:none}
.btn.primary{background:var(--pink);color:#fff}
.btn.primary .can{font-size:18px}
.btn.ghost{background:#fff;color:var(--brown)}
.btn.reward{
  grid-column:1/-1;
  background:linear-gradient(90deg,#ffd76b,#f4b740);
  color:#5a3b00;
  position:relative;
  overflow:hidden;
}
.btn.reward::after{
  content:"AD";
  position:absolute;top:6px;right:8px;
  font-size:9px;background:#5a3b00;color:#ffd76b;
  padding:1px 5px;border-radius:6px;letter-spacing:.1em;
}
.cost{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(0,0,0,.18);
  color:#fff;
  font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:999px;
}
.btn.ghost .cost{background:rgba(91,58,41,.15);color:var(--brown)}

/* ===== Collection / progress ===== */
.tree{
  display:flex;gap:6px;overflow-x:auto;padding:4px 2px;
  scrollbar-width:none;
}
.tree::-webkit-scrollbar{display:none}
.zukan-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.zukan-grid .tier{width:auto;padding:10px 6px}
.zukan-grid .tier .e{font-size:36px}
.zukan-grid .tier .n{font-size:11px;margin-top:6px}
.tier{
  flex:0 0 auto;
  width:56px;text-align:center;
  background:#fff;border:2px solid var(--ink);
  border-radius:14px;padding:6px 4px;
  position:relative;
}
.tier.locked{opacity:.4;filter:grayscale(.6)}
.tier .e{font-size:22px;line-height:1}
.tier .n{font-size:9px;color:var(--brown-soft);margin-top:2px;letter-spacing:.02em}
.tier .b{
  position:absolute;top:-6px;left:-6px;
  background:var(--pink);color:#fff;font-size:9px;font-weight:800;
  border-radius:999px;padding:2px 5px;border:2px solid #fff;
}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:999px;
  font-weight:700;font-size:13px;
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  z-index:20;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ===== Merge burst ===== */
.burst{position:absolute;inset:0;pointer-events:none}
.spark{
  position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
  background:var(--gold);
  animation:spark .7s ease-out forwards;
}
@keyframes spark{
  0%{transform:translate(-50%,-50%) scale(.6)}
  100%{transform:translate(calc(-50% + var(--dx))   ,calc(-50% + var(--dy))) scale(0);opacity:0}
}

/* ===== Modal ===== */
.modal{
  position:fixed;inset:0;background:rgba(58,36,24,.55);
  display:none;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.modal.show{display:flex}
.modal .card{
  background:linear-gradient(180deg,#fffaf2,#ffe9d4);
  border:2px solid var(--ink);border-radius:var(--radius);
  padding:24px 20px;text-align:center;max-width:340px;width:100%;
  box-shadow:var(--shadow);
}
.modal h3{font-family:'Mochiy Pop One',sans-serif;color:var(--brown);font-size:18px;margin-bottom:6px}
.modal .big{font-size:64px;margin:8px 0}

<body>
<div class="app" id="app">

  <!-- top ad placeholder -->
  <div class="ad top" id="adTop">［広告スペース／AdSense 上部バナー］</div>

      <span class="ic">🥫</span>

    </div>
    <div class="points" title="にゃんこポイント">
      <span class="coin">P</span>
      <span id="pts">0</span>
    </div>

  <!-- ===== HOME SCREEN ===== -->

  <!-- course -->

  </div><!-- /home-screen -->

  <div class="shop-screen">

  <!-- toast -->

    </div>
  </div>

  <!-- bottom ad placeholder -->
  <div class="ad bottom" id="adBottom">［広告スペース／AdSense 下部バナー 320×50〕</div>

  <!-- footer tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="home"><span class="ic">🏠</span>ホーム</button>
    <button class="tab-btn" data-tab="shop"><span class="ic">🛍️</span>ショップ</button>
    <button class="tab-btn" data-tab="zukan"><span class="ic">📖</span>ずかん</button>
  </nav>
</div>

<!-- level up modal -->
<div class="modal" id="modal">
  <div class="card">
    <div style="font-size:10px;letter-spacing:.2em;color:var(--pink-deep);font-weight:800">NEW NYANKO!</div>
    <h3 id="mName">茶トラ</h3>
    <div class="big" id="mEmoji">🐈</div>
    <p id="mDesc">あたらしい猫が なかまになった！</p>
    <button class="btn primary" id="mClose">つづける</button>
  </div>
</div>

<script>
/* ============ Data ============ */
const CATS = [
  {lv:1,  name:'子猫',          emoji:'🐱', rate:1,   color:'#ffd6a5'},
  {lv:2,  name:'茶トラ',        emoji:'🐈', rate:2,   color:'#e9a06b'},
  {lv:3,  name:'サバトラ',      emoji:'😺', rate:4,   color:'#b9c4cc'},
  {lv:4,  name:'三毛猫',        emoji:'😸', rate:8,   color:'#f6c177'},
  {lv:5,  name:'キジトラ',      emoji:'😻', rate:16,  color:'#a78760'},
  {lv:6,  name:'ロシアンブルー',emoji:'😽', rate:32,  color:'#8fb5d1'},
  {lv:7,  name:'ペルシャ',      emoji:'🙀', rate:64,  color:'#ffe9d4'},
  {lv:8,  name:'メインクーン',  emoji:'😼', rate:128, color:'#c79b6f'},
  {lv:9,  name:'スコティッシュ',emoji:'🐈‍⬛', rate:256, color:'#5b4a44'},
  {lv:10, name:'ライオン（幻）',emoji:'🦁', rate:600, color:'#f4b740'},
];

const GRID_BASE = 16;
const GRID_EXPANDED = 25;

const STORAGE_KEY = 'nyanko_house_v2';
const OLD_KEY_V1 = 'nyanko_house_v1';
const OLD_KEY_V0 = 'nyanko_v1';
let isSummoning = false;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)) }
function load(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    // migrate from older versions
    const olderRaw = localStorage.getItem(OLD_KEY_V1) || localStorage.getItem(OLD_KEY_V0);
    if (olderRaw){
      const old = JSON.parse(olderRaw);
      const migrated = {
        version: 2,
        cans: 3,
        points: old.points || 0,
        grid: old.grid && old.grid.length === GRID_BASE ? old.grid : Array(GRID_BASE).fill(null),
        course: old.course || [],
        maxUnlocked: old.maxUnlocked || 1,
        expanded: false,
        luckyCharm: 0,
        speedUntil: 0,
        lastBonusDate: '',
        firstHintShown: !!((old.course && old.course.length > 0) || (old.grid && old.grid.some(c=>c))),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }
    return null;
  }catch(e){ return null }
}

/* ============ State ============ */
let state = load() || {
  version: 2,
  cans: 3,
  points: 0,
  grid: Array(GRID_BASE).fill(null),
  course: [],
  maxUnlocked: 1,
  expanded: false,
  luckyCharm: 0,
  speedUntil: 0,
  lastBonusDate: '',
  firstHintShown: false,
};
// ensure grid size matches expanded state
const __targetSize = state.expanded ? GRID_EXPANDED : GRID_BASE;
if (state.grid.length !== __targetSize){
  const next = Array(__targetSize).fill(null);
  state.grid.forEach((c,i)=>{ if (i < __targetSize) next[i] = c });
  state.grid = next;
}

/* ============ Render ============ */
const $grid = document.getElementById('grid');
const $course = document.getElementById('course');
const $pts = document.getElementById('pts');
const $cans = document.getElementById('cans');
const $costLbl = document.getElementById('costLbl');
const $capacity = document.getElementById('capacity');
const $firstHint = document.getElementById('firstHint');
const $tree = document.getElementById('tree');
const $shopList = document.getElementById('shopList');
const $speedBadge = document.getElementById('speedBadge');
const $summonBtn = document.getElementById('summon');

function catData(lv){ return CATS[lv-1] }

function renderGrid(){
  $grid.innerHTML = '';
  $grid.classList.toggle('expanded', state.expanded);
  state.grid.forEach((c, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (c ? ' has' : '');
    cell.dataset.idx = i;

    if (c){
      const n = document.createElement('div');
      n.className = 'nyan' + (c.lv === 10 ? ' legendary' : '');
      n.style.background = `radial-gradient(circle at 35% 30%, #fff, ${catData(c.lv).color} 60%, ${shade(catData(c.lv).color,-20)} 100%)`;
      n.draggable = true;
      n.dataset.idx = i;
      n.innerHTML = `${catData(c.lv).emoji}<span class="lv">Lv${c.lv}</span>`;
      cell.appendChild(n);

      n.addEventListener('dragstart', onDragStart);
      n.addEventListener('dragend', onDragEnd);
      n.addEventListener('touchstart', onTouchStart, {passive:false});
    }

    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drop') });
    cell.addEventListener('dragleave', () => cell.classList.remove('drop'));
    cell.addEventListener('drop', onDrop);

    $grid.appendChild(cell);
  });

  const empty = state.grid.filter(x => !x).length;
  $capacity.textContent = `空き ${empty}/${state.grid.length}`;
}

function renderHud(){
  $pts.textContent = Math.floor(state.points);
  $cans.textContent = state.cans;
  $costLbl.textContent = '×1';
  // summon button enabled if has can AND space AND not animating
  $summonBtn.disabled = isSummoning || state.cans < 1 || state.grid.every(x => x);
  $summonBtn.classList.toggle('has-charm', state.luckyCharm > 0);
  // speed badge
  const speedRemain = Math.ceil((state.speedUntil - Date.now())/1000);
  if (speedRemain > 0){
    $speedBadge.style.display = 'block';
    $speedBadge.textContent = `⚡ ×2 ${speedRemain}s`;
  } else {
    $speedBadge.style.display = 'none';
  }
  // first hint: show only if coursesイベント once
  if (!state.firstHintShown && state.course.length === 0){
    $firstHint.style.display = 'flex';
  } else {
    $firstHint.style.display = 'none';
  }
}

function renderTree(){
  $tree.innerHTML = '';
  CATS.forEach(c => {
    const t = document.createElement('div');
    t.className = 'tier' + (c.lv > state.maxUnlocked ? ' locked' : '');
    t.innerHTML = `
      <span class="b">Lv${c.lv}</span>
      <div class="e">${c.lv > state.maxUnlocked ? '❓' : c.emoji}</div>
      <div class="n">${c.lv > state.maxUnlocked ? '???' : c.name}</div>
    `;
    $tree.appendChild(t);
  });
}

function renderCourse(){
  // remove all runners
  $course.querySelectorAll('.runner').forEach(n => n.remove());
  state.course.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'runner bounce';
    el.style.setProperty('--dur', c.dur + 's');
    el.style.animationDelay = `-${(i * 1.5) % c.dur}s`;
    el.textContent = catData(c.lv).emoji;
    el.dataset.courseIdx = i;
    el.draggable = true;
    el.title = 'ドラッグで召喚エリアに戻せる';
    el.addEventListener('dragstart', onCourseDragStart);
    el.addEventListener('dragend', onDragEnd);
    el.addEventListener('touchstart', onCourseTouchStart, {passive:false});
    $course.appendChild(el);
  });
  // first hint visibility is managed in renderHud
}

// course as drop target
$course.addEventListener('dragover', e => {
  e.preventDefault();
  if (dragFrom !== null && state.course.length < 5) $course.classList.add('drop-target');
});
$course.addEventListener('dragleave', () => $course.classList.remove('drop-target'));
$course.addEventListener('drop', e => {
  e.preventDefault();
  $course.classList.remove('drop-target');
  if (dragFrom === null) return;
  moveGridToCourse(dragFrom);
  dragFrom = null;
});

/* ============ Helpers ============ */
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0,Math.min(255, r + Math.round(r*pct/100)));
  g = Math.max(0,Math.min(255, g + Math.round(g*pct/100)));
  b = Math.max(0,Math.min(255, b + Math.round(b*pct/100)));
  return '#' + ((1<<24) + (r<<16)+(g<<8)+b).toString(16).slice(1);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1500);
}

/* ============ Drag & drop ============ */
let dragFrom = null;
let dragFromCourse = null;
let touchDragCourse = null;

function onDragStart(e){
  dragFrom = +e.currentTarget.dataset.idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.setData('text/plain', dragFrom);
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  // clear after a tick so drop handlers run first
  setTimeout(()=>{ dragFromCourse = null; }, 0);
}

function onDrop(e){
  e.preventDefault();
  const cell = e.currentTarget;
  cell.classList.remove('drop');
  const to = +cell.dataset.idx;
  if (dragFromCourse !== null){
    moveCourseToGrid(dragFromCourse);
    dragFromCourse = null;
    return;
  }
  if (dragFrom === null || to === dragFrom) return;
  handleMove(dragFrom, to);
  dragFrom = null;
}

/* touch drag (mobile) */
let touchDrag = null;
function onTouchStart(e){
  e.preventDefault();
  const el = e.currentTarget;
  const idx = +el.dataset.idx;
  const clone = el.cloneNode(true);
  clone.style.position = 'fixed';
  clone.style.pointerEvents = 'none';
  clone.style.zIndex = 100;
  clone.style.width = el.offsetWidth + 'px';
  clone.style.height = el.offsetHeight + 'px';
  clone.style.opacity = .9;
  document.body.appendChild(clone);
  touchDrag = {from:idx, clone};

  const move = ev => {
    const t = ev.touches[0];
    clone.style.left = (t.clientX - clone.offsetWidth/2) + 'px';
    clone.style.top  = (t.clientY - clone.offsetHeight/2) + 'px';
    const el2 = document.elementFromPoint(t.clientX, t.clientY);
    document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop'));
    $course.classList.remove('drop-target');
    if (el2){
      const cell = el2.closest('.cell');
      if (cell) {
        cell.classList.add('drop');
      } else if (el2.closest('#course') || el2.closest('.course-wrap')) {
        if (state.course.length < 5) $course.classList.add('drop-target');
      }
    }
  };
  const end = ev => {
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    const t = ev.changedTouches[0];
    const el2 = document.elementFromPoint(t.clientX, t.clientY);
    const cell = el2 && el2.closest('.cell');
    const courseHit = el2 && (el2.closest('#course') || el2.closest('.course-wrap'));
    document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop'));
    $course.classList.remove('drop-target');
    clone.remove();
    if (cell){
      const to = +cell.dataset.idx;
      if (to !== touchDrag.from) handleMove(touchDrag.from, to);
    } else if (courseHit){
      moveGridToCourse(touchDrag.from);
    }
    touchDrag = null;
  };
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('touchend', end);
  // trigger first move to position clone
  move(e);
}

/* ============ Logic ============ */
function handleMove(from, to){
  const a = state.grid[from], b = state.grid[to];
  if (!a) return;
  if (!b){
    // move
    state.grid[to] = a;
    state.grid[from] = null;
  } else if (a.lv === b.lv && a.lv < 10){
    // merge
    state.grid[to] = { lv: a.lv + 1 };
    state.grid[from] = null;
    spawnBurst(to);
    const newLv = a.lv + 1;
    if (newLv > state.maxUnlocked){
      state.maxUnlocked = newLv;
      showLevelUp(newLv);
    } else {
      toast(`Lv${newLv} ${catData(newLv).name} にしんか！`);
    }
  } else if (a.lv === b.lv && a.lv === 10){
    toast('ライオンはこれ以上進化しない');
  } else {
    toast('同じ猫じゃないとマージできないよ');
  }
  save(); renderGrid(); renderHud(); renderTree();
}

function moveGridToCourse(gridIdx){
  const cat = state.grid[gridIdx];
  if (!cat) return;
  if (state.course.length >= 5){ toast('コースは5匹までだよ'); return }
  state.grid[gridIdx] = null;
  const dur = Math.max(4, 12 - cat.lv * 0.8);
  state.course.push({ lv: cat.lv, dur, id: Date.now()+Math.random() });
  state.firstHintShown = true;
  toast(`${catData(cat.lv).name} がコースへ！`);
  save(); renderGrid(); renderHud(); renderCourse();
}

function moveCourseToGrid(courseIdx){
  const cat = state.course[courseIdx];
  if (!cat) return;
  const empty = state.grid.findIndex(x => !x);
  if (empty === -1){ toast('召喚エリアに空きがないよ'); return }
  state.course.splice(courseIdx, 1);
  state.grid[empty] = { lv: cat.lv };
  toast(`${catData(cat.lv).name} がもどってきた`);
  save(); renderGrid(); renderHud(); renderCourse();
}

// course runner drag start
function onCourseDragStart(e){
  const idx = +e.currentTarget.dataset.courseIdx;
  dragFromCourse = idx;
  e.dataTransfer.setData('text/plain', 'course:'+idx);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function onCourseTouchStart(e){
  e.preventDefault();
  const el = e.currentTarget;
  const idx = +el.dataset.courseIdx;
  const clone = el.cloneNode(true);
  clone.style.position = 'fixed';
  clone.style.pointerEvents = 'none';
  clone.style.zIndex = 100;
  clone.style.animation = 'none';
  clone.style.left = '-9999px';
  document.body.appendChild(clone);
  touchDragCourse = {from:idx, clone};

  const move = ev => {
    const t = ev.touches[0];
    clone.style.left = (t.clientX - 20) + 'px';
    clone.style.top  = (t.clientY - 20) + 'px';
  };
  const end = ev => {
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    const t = ev.changedTouches[0];
    const el2 = document.elementFromPoint(t.clientX, t.clientY);
    clone.remove();
    // if dropped over grid (any cell), return to grid
    const cell = el2 && el2.closest('.cell');
    if (cell) moveCourseToGrid(touchDragCourse.from);
    touchDragCourse = null;
  };
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('touchend', end);
  move(e);
}

function spawnBurst(idx){
  const cell = $grid.children[idx];
  const b = document.createElement('div');
  b.className = 'burst';
  for (let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const a = (i/10) * Math.PI*2;
    s.style.setProperty('--dx', Math.cos(a)*40 + 'px');
    s.style.setProperty('--dy', Math.sin(a)*40 + 'px');
    s.style.background = i%2 ? 'var(--pink)' : 'var(--gold)';
    b.appendChild(s);
  }
  cell.appendChild(b);
  setTimeout(()=>b.remove(), 800);
}

function summon(){
  if (isSummoning) return;
  if (state.cans < 1) { toast('猫缶が足りない…'); return }
  const empty = state.grid.findIndex(x => !x);
  if (empty === -1) { toast('召喚エリアがいっぱい！'); return }

  isSummoning = true;
  state.cans -= 1;

  // determine cat level: lucky charm guarantees Lv2, otherwise Lv1
  let spawnLv = 1;
  let usedCharm = false;
  if (state.luckyCharm > 0){
    state.luckyCharm -= 1;
    spawnLv = 2;
    usedCharm = true;
  }
  renderHud();

  // rare flash (1% chance, or always with charm)
  const isRare = usedCharm || Math.random() < 0.01;
  const $gacha = document.getElementById('gacha');
  const $rare = document.getElementById('gachaRare');
  const $catEmoji = document.getElementById('canCat');
  $catEmoji.textContent = catData(spawnLv).emoji;
  $rare.style.display = isRare ? 'block' : 'none';
  $gacha.classList.remove('show');
  void $gacha.offsetWidth;
  $gacha.classList.add('show');

  setTimeout(()=>{
    const slot = state.grid.findIndex(x => !x);
    if (slot !== -1){
      state.grid[slot] = { lv: spawnLv };
      if (spawnLv > state.maxUnlocked) state.maxUnlocked = spawnLv;
    } else {
      // refund can
      state.cans += 1;
      if (usedCharm) state.luckyCharm += 1;
      toast('召喚エリアがいっぱい。返金したよ');
    }
    isSummoning = false;
    save(); renderGrid(); renderHud(); renderTree();
    $gacha.classList.remove('show');
    if (usedCharm) toast('🍀 幸運の鈴で Lv2 が出現！');
    else if (isRare) toast('✨ キラッ！ 何かの予感…');
  }, 1200);
}

function sendToCourse(){
  if (state.course.length >= 5){ toast('コースは5匹までだよ'); return }
  let bestIdx = -1, bestLv = 0;
  state.grid.forEach((c,i)=>{ if (c && c.lv > bestLv){ bestLv = c.lv; bestIdx = i } });
  if (bestIdx === -1){ toast('召喚エリアに猫がいないよ'); return }
  moveGridToCourse(bestIdx);
}

function showLevelUp(lv){
  const c = catData(lv);
  document.getElementById('mName').textContent = c.name;
  document.getElementById('mEmoji').textContent = c.emoji;
  document.getElementById('mDesc').textContent = lv === 10
    ? 'でんせつの ライオンが目をさました！'
    : `あたらしい猫 ${c.name} がなかまになった！`;
  document.getElementById('modal').classList.add('show');
}

/* ============ Income loop ============ */
let lastTick = Date.now();
setInterval(()=>{
  const now = Date.now();
  const dt = (now - lastTick)/1000;
  lastTick = now;
  // speed boost multiplier
  const speedMul = state.speedUntil > now ? 2 : 1;
  // adjust runner animation duration via CSS variable: scale down for speed
  $course.querySelectorAll('.runner').forEach((el,i)=>{
    const c = state.course[i];
    if (!c) return;
    const targetDur = c.dur / speedMul;
    el.style.setProperty('--dur', targetDur + 's');
  });
  if (!state.course.length) {
    if (speedMul === 1 && $speedBadge.style.display !== 'none') renderHud();
    return;
  }
  let gain = 0;
  state.course.forEach(c => {
    gain += catData(c.lv).rate / (c.dur*1.2);
  });
  gain *= dt * speedMul;
  state.points += gain;
  if (Math.random() < dt * 0.8) {
    const pop = document.createElement('div');
    pop.className = 'coin-pop';
    pop.textContent = '+' + Math.max(1, Math.floor(gain*5));
    pop.style.left = (20 + Math.random()*60) + '%';
    pop.style.top  = (30 + Math.random()*40) + '%';
    $course.appendChild(pop);
    setTimeout(()=>pop.remove(), 1000);
  }
  renderHud();
  if (Math.random() < 0.02) save();
}, 200);

/* ============ Events ============ */
document.getElementById('summon').addEventListener('click', summon);
document.getElementById('send').addEventListener('click', sendToCourse);

// footer tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    const tab = btn.dataset.tab;
    document.getElementById('app').classList.remove('tab-zukan','tab-shop');
    if (tab === 'zukan') document.getElementById('app').classList.add('tab-zukan');
    if (tab === 'shop')  document.getElementById('app').classList.add('tab-shop');
    if (tab === 'shop') renderShop();
  });
});

/* ============ Shop ============ */
const SHOP_ITEMS = [
  {
    id:'speed',
    name:'スピードアップ',
    desc:'30秒間 コース速度2倍',
    icon:'🐾',
    price:50,
    type:'consumable',
    action: ()=>{
      const now = Date.now();
      const base = Math.max(now, state.speedUntil);
      state.speedUntil = base + 30000;
      toast('⚡ スピードアップ発動！');
    }
  },
  {
    id:'charm',
    name:'幸運の鈴',
    desc:'次の召喚で必ずLv2の猫',
    icon:'🍀',
    price:200,
    type:'stockable',
    action: ()=>{
      state.luckyCharm += 1;
      toast('🍀 幸運の鈴を入手！');
    }
  },
  {
    id:'expand',
    name:'おうち拡張',
    desc:'召喚エリアを 4×4 → 5×5 に',
    icon:'🏠',
    price:1000,
    type:'oneTime',
    isOwned: ()=> state.expanded,
    action: ()=>{
      state.expanded = true;
      const next = Array(GRID_EXPANDED).fill(null);
      state.grid.forEach((c,i)=>{ next[i] = c });
      state.grid = next;
      toast('🏠 おうちが広くなった！');
    }
  },
];

function renderShop(){
  $shopList.innerHTML = '';
  SHOP_ITEMS.forEach(item => {
    const owned = item.isOwned && item.isOwned();
    const canBuy = !owned && state.points >= item.price;
    const row = document.createElement('div');
    row.className = 'shop-item' + (owned ? ' owned' : '');
    let stockHtml = '';
    if (item.id === 'charm' && state.luckyCharm > 0) stockHtml = `<div class="stock">所持 ×${state.luckyCharm}</div>`;
    row.innerHTML = `
      <div class="si-ic">${item.icon}</div>
      <div class="si-info">
        <div class="si-name">${item.name}</div>
        <div class="si-desc">${item.desc}</div>
        ${stockHtml}
      </div>
      <button class="si-buy" ${owned||!canBuy?'disabled':''}>
        ${owned ? '購入済' : '購入'}
        <span class="price">P ${item.price}</span>
      </button>
    `;
    row.querySelector('.si-buy').addEventListener('click', ()=>{
      if (owned) return;
      if (state.points < item.price){ toast('ポイントが足りない…'); return }
      state.points -= item.price;
      item.action();
      save(); renderHud(); renderShop();
      if (item.id === 'expand') renderGrid();
    });
    $shopList.appendChild(row);
  });
}

/* ============ Login bonus ============ */
function checkLoginBonus(){
  const today = new Date();
  const ymd = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
  if (state.lastBonusDate !== ymd){
    state.lastBonusDate = ymd;
    state.points += 50;
    save();
    setTimeout(()=>toast('📅 ログインボーナス！ ポイント +50'), 600);
  }
}
document.getElementById('rewardAd').addEventListener('click', ()=>{
  if (rewardCooldownUntil > Date.now()) return;
  toast('（広告再生シミュレーション）');
  setTimeout(()=>{
    state.points += 50;
    toast('ポイント +50！');
    save(); renderHud();
    rewardCooldownUntil = Date.now() + 30000;
    updateRewardButton();
  }, 800);
});

// reward ad cooldown
let rewardCooldownUntil = 0;
const $rewardBtn = document.getElementById('rewardAd');
const REWARD_LABEL = $rewardBtn.innerHTML;
function updateRewardButton(){
  const remain = Math.ceil((rewardCooldownUntil - Date.now()) / 1000);
  if (remain > 0){
    $rewardBtn.disabled = true;
    $rewardBtn.innerHTML = `⏳ 待機中… ${remain}s`;
  } else {
    $rewardBtn.disabled = false;
    $rewardBtn.innerHTML = REWARD_LABEL;
  }
}
setInterval(updateRewardButton, 1000);
document.getElementById('mClose').addEventListener('click', ()=>{
  document.getElementById('modal').classList.remove('show');
});

/* init */
function setAppHeight(){
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
// iOS Safari toolbar reveal/hide
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

renderGrid(); renderHud(); renderTree(); renderCourse();
checkLoginBonus();
</script>
</body>
</html>
